<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travessia Indie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      overflow: hidden;
    }

    header img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 2.5rem 1rem;
      background-color: #111;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #222;
      transition: background-color 0.3s, transform 0.2s;
    }

    .social-links a:hover {
      transform: scale(1.1);
    }

    .social-links a.youtube:hover {
      background-color: #ff0000;
    }

    .social-links a.instagram:hover {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
    }

    .social-links a svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 0.8rem;
      color: #666;
      border-top: 1px solid #1a1a1a;
    }
  </style>
</head>

  <header>
    <img src="image_2.png" alt="Travessia Indie - Site em construção">
  </header>
