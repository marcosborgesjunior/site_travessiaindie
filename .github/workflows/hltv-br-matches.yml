# Busca os jogos do Brasil em TODAY'S MATCHES (HLTV) e publica o JSON
# no site (Pages deploy-from-branch republica a main automaticamente).
# JSON final: https://www.travessiaindie.com.br/brazil-matches.json
name: Jogos BR (HLTV)

on:
  schedule:
    # 03:10 UTC = 00:10 em São Paulo — roda depois da virada do dia
    - cron: "10 3 * * *"
  workflow_dispatch: # rodar manualmente (Actions > Jogos BR > Run workflow)

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hltv/requirements.txt

      - name: Instalar dependências
        run: pip install -r hltv/requirements.txt

      - name: Rodar scraper
        run: python hltv/scraper.py --out brazil-matches.json

      - name: Commit do JSON atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brazil-matches.json
          if git diff --cached --quiet; then
            echo "JSON sem mudancas — nada a commitar."
          else
            git commit -m "data: atualiza jogos do Brasil (HLTV)"
            git push
          fi
