# Baixa snapshots das páginas do HLTV pelo runner (IP deles não leva 403)
# e committa em hltv/snapshots/ — usados para mapear markup dos eventos.
name: Snapshot HLTV (events)

on:
  workflow_dispatch:
    inputs:
      event_url:
        description: "URL da página de um evento (além da lista /events)"
        required: false
        default: "https://www.hltv.org/events/8251/blast-rivals-2026-season-2"

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hltv/requirements.txt

      - name: Instalar dependências
        run: pip install -r hltv/requirements.txt

      - name: Baixar snapshots
        run: |
          python - <<'PY'
          import os, re, sys
          from curl_cffi import requests

          H = {"Accept-Language": "en-US,en;q=0.9"}
          os.makedirs("hltv/snapshots", exist_ok=True)
          status = []

          urls = {
              "events-list.html": "https://www.hltv.org/events",
          }
          ev = os.environ.get("EVENT_URL", "").strip()
          if ev:
              m = re.search(r"/events/(\d+)/", ev)
              name = f"event-{m.group(1)}.html" if m else "event-custom.html"
              urls[name] = ev
              # aba Matches do evento = pagina separada /events/<id>/matches
              if m:
                  urls[f"event-{m.group(1)}-matches.html"] = (
                      f"https://www.hltv.org/events/{m.group(1)}/matches"
                  )

          for fn, url in urls.items():
              r = requests.get(url, impersonate="chrome", headers=H, timeout=30)
              print(fn, r.status_code, len(r.text))
              status.append(f"{fn}: HTTP {r.status_code} <- {url}")
              if r.status_code != 200 or "Just a moment" in r.text[:2000]:
                  # extras: nao derrubam o snapshot
                  if fn.endswith("-matches.html") or fn in (
                      "highlights.html", "match-live.html"
                  ):
                      print(f"::warning::pulando {url} ({r.status_code})")
                      continue
                  sys.exit(f"falha ao baixar {url}: {r.status_code}")
              open(f"hltv/snapshots/{fn}", "w", encoding="utf-8").write(r.text)

          # extras: highlights + pagina do1º match AO VIVO (jogo live da FURIA etc.)
          extras = {"highlights.html": "https://www.hltv.org/highlights"}
          try:
              rm = requests.get(
                  "https://www.hltv.org/matches", impersonate="chrome",
                  headers=H, timeout=30,
              )
              if rm.status_code == 200:
                  lm = re.search(
                      r'<div class="match-wrapper[^>]*live="true"[^>]*>.*?'
                      r'href="(/matches/[^"]+)"',
                      rm.text, re.S,
                  )
                  if lm:
                      extras["match-live.html"] = "https://www.hltv.org" + lm.group(1)
                      print("match live:", lm.group(1))
          except Exception as e:  # noqa: BLE001
              print(f"::warning::sem match live: {e}")

          for fn, url in extras.items():
              try:
                  r = requests.get(url, impersonate="chrome", headers=H, timeout=30)
                  print(fn, r.status_code, len(r.text))
                  status.append(f"{fn}: HTTP {r.status_code} <- {url}")
                  if r.status_code == 200 and "Just a moment" not in r.text[:2000]:
                      open(f"hltv/snapshots/{fn}", "w", encoding="utf-8").write(r.text)
                  else:
                      print(f"::warning::pulando {url} ({r.status_code})")
              except Exception as e:  # noqa: BLE001
                  print(f"::warning::falha em {url}: {e}")
                  status.append(f"{fn}: EXC {e} <- {url}")

          open("hltv/snapshots/STATUS.txt", "w", encoding="utf-8").write(
              "\n".join(status) + "\n"
          )
          PY

      - name: Commit dos snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hltv/snapshots
          if git diff --cached --quiet; then
            echo "Snapshots identicos."
          else
            git commit -m "data: snapshot das paginas do HLTV (events)"
            git push
          fi
    env:
      EVENT_URL: ${{ inputs.event_url }}
